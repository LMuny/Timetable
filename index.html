<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Hours Planner" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
  <title>Hours Planner</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f9f7;
      --bg-secondary: #ffffff;
      --bg-tertiary: #eef2ed;
      --bg-success: #dff5df;
      --bg-warning: #fff1dc;
      --bg-danger: #fde4de;
      --bg-info: #e2efff;
      --text: #10211c;
      --text-secondary: #456059;
      --text-tertiary: #718881;
      --text-success: #1f7a40;
      --text-warning: #a25500;
      --text-danger: #b1322f;
      --text-info: #4d42cc;
      --border: #d7e0dc;
      --border-strong: #8aa89d;
      --absent-bg: #ffece4;
      --absent-text: #a44b27;
      --we-bg: #dff7ef;
      --we-text: #0e7255;
      --we-hover: #8cd9c0;
      --workday-start: #ffffff;
      --workday-end: #f2f0ff;
      --workday-border: #e4ece8;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow-soft: 0 10px 28px rgba(10, 32, 26, 0.08);
      --shadow-press: 0 4px 14px rgba(10, 32, 26, 0.16);
      --bg-page-end: #f1f5f1;
      --pattern-line: rgba(13, 57, 45, 0.08);
      --title-shadow: rgba(255, 255, 255, 0.35);
      --highlight-start: #ece8ff;
      --highlight-end: #e6ecff;
      --highlight-border: #b8b0ff;
      --accent-a: #6a4ae0;
      --accent-b: #2f7ff1;
      --scroll-shift: 0px;
      --switch-tint-opacity: 0;
      --font: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-head: 'Space Grotesk', 'Manrope', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1221;
        --bg-secondary: #171b2f;
        --bg-tertiary: #202845;
        --bg-success: #1e2f4f;
        --bg-warning: #413421;
        --bg-danger: #3b2029;
        --bg-info: #1f2f52;
        --text: #eef1ff;
        --text-secondary: #b7c2ef;
        --text-tertiary: #8995c8;
        --text-success: #a9bcff;
        --text-warning: #ffc67b;
        --text-danger: #f5a2a2;
        --text-info: #b7afff;
        --border: #323a63;
        --border-strong: #6672b2;
        --absent-bg: #3d2730;
        --absent-text: #f4a988;
        --we-bg: #1d2742;
        --we-text: #9fb7ff;
        --we-hover: #3b4f89;
        --workday-start: #1a1d24;
        --workday-end: #242a34;
        --workday-border: #343a46;
        --shadow-soft: 0 12px 32px rgba(0, 0, 0, 0.35);
        --shadow-press: 0 4px 14px rgba(0, 0, 0, 0.45);
        --bg-page-end: #10142a;
        --pattern-line: rgba(128, 140, 211, 0.08);
        --title-shadow: rgba(0, 0, 0, 0.3);
        --highlight-start: #2a3154;
        --highlight-end: #213452;
        --highlight-border: #5a5fa3;
        --accent-a: #7b61ff;
        --accent-b: #4f8cff;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font);
      background:
        radial-gradient(circle at 15% -10%, rgba(106, 74, 224, 0.18), transparent 40%),
        radial-gradient(circle at 85% 5%, rgba(47, 127, 241, 0.2), transparent 36%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-page-end) 100%);
      background-position:
        0 calc(var(--scroll-shift) * -0.2),
        0 calc(var(--scroll-shift) * -0.1),
        0 0;
      color: var(--text);
      min-height: 100dvh;
      width: 100%;
      padding: env(safe-area-inset-top, 12px) env(safe-area-inset-right, 0)
        env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      position: relative;
      overflow-x: hidden;
      transition: background 0.35s ease, background-position 0.18s ease-out;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        linear-gradient(transparent 95%, var(--pattern-line) 96%),
        linear-gradient(90deg, transparent 95%, var(--pattern-line) 96%);
      background-size: 24px 24px;
      transform: translateY(calc(var(--scroll-shift) * 0.08));
      transition: transform 0.18s ease-out, opacity 0.35s ease;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: calc(var(--switch-tint-opacity) + 0.08);
      transition: opacity 0.35s ease, background 0.35s ease;
      background:
        radial-gradient(45% 30% at 20% 24%, rgba(123, 97, 255, 0.24), transparent 70%),
        radial-gradient(40% 28% at 80% 30%, rgba(79, 140, 255, 0.26), transparent 72%),
        radial-gradient(35% 24% at 60% 72%, rgba(255, 255, 255, 0.18), transparent 76%);
      filter: blur(36px) saturate(118%);
      transform: translateY(calc(var(--scroll-shift) * -0.04));
    }

    body.view-planner { --switch-tint-opacity: 0.1; }
    body.view-tracker { --switch-tint-opacity: 0.22; }
    body.view-tracker::after {
      background:
        radial-gradient(48% 32% at 16% 24%, rgba(107, 94, 255, 0.3), transparent 70%),
        radial-gradient(42% 30% at 82% 30%, rgba(72, 157, 255, 0.32), transparent 72%),
        radial-gradient(30% 20% at 62% 70%, rgba(255, 255, 255, 0.14), transparent 76%);
    }

    #app {
      position: relative;
      z-index: 1;
      padding: 16px 14px 20px;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      font-family: var(--font-head);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.2px;
      margin-bottom: 14px;
      text-shadow: 0 1px 0 var(--title-shadow);
    }

    .view-switch {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
      padding: 6px;
      border-radius: 999px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .view-switch::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 6px;
      width: calc(50% - 9px);
      height: calc(100% - 12px);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent-a) 0%, var(--accent-b) 100%);
      box-shadow: var(--shadow-press);
      transition: left 0.32s cubic-bezier(.2,.8,.2,1);
      z-index: 0;
    }
    .view-switch.is-tracker::before {
      left: calc(50% + 3px);
    }
    .view-switch button {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.2s ease, color 0.2s ease;
    }
    .view-switch button:active {
      transform: scale(0.98);
    }
    .view-switch button.active {
      color: #fff;
    }

    .view-panel { display: none; }
    .view-panel.active {
      display: block;
      animation: panel-rise 0.24s ease;
    }

    @keyframes panel-rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top bar */
    .top-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
      background: color-mix(in srgb, var(--bg-secondary) 82%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      padding: 12px;
      backdrop-filter: blur(12px) saturate(120%);
      -webkit-backdrop-filter: blur(12px) saturate(120%);
    }
    .month-nav { display: flex; align-items: center; gap: 10px; }
    .month-nav button {
      width: 36px;
      height: 36px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      display: grid;
      place-items: center;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    .month-nav button:active {
      transform: scale(0.96);
      border-color: var(--border-strong);
    }
    .month-label {
      flex: 1;
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.2px;
    }

    .slider-row { display: flex; align-items: center; gap: 10px; }
    .slider-row label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.35px;
      white-space: nowrap;
    }
    .slider-row input[type=range] {
      flex: 1;
      accent-color: var(--accent-a);
    }
    .slider-val {
      font-size: 13px;
      font-weight: 700;
      width: 74px;
      text-align: right;
      color: var(--text-info);
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      border-radius: 9px;
      padding: 6px 8px;
      font-family: var(--font);
      font-variant-numeric: tabular-nums;
    }
    .slider-val:focus {
      outline: 2px solid rgba(106, 74, 224, 0.2);
      border-color: var(--accent-a);
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: color-mix(in srgb, var(--bg-secondary) 84%, transparent);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 11px 12px;
      backdrop-filter: blur(8px) saturate(115%);
      -webkit-backdrop-filter: blur(8px) saturate(115%);
    }
    .stat-card.highlight {
      background: linear-gradient(145deg, var(--highlight-start) 0%, var(--highlight-end) 100%);
      border-color: var(--highlight-border);
    }
    .stat-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.35px;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .stat-card.highlight .stat-label { color: var(--text-info); opacity: 0.85; }
    .stat-value {
      font-family: var(--font-head);
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }
    .stat-card.highlight .stat-value { color: var(--text-info); }
    .stat-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
    .stat-card.highlight .stat-sub { color: var(--text-info); opacity: 0.7; }

    /* Alert */
    .alert {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.45;
      border-left: 4px solid transparent;
      box-shadow: var(--shadow-soft);
    }
    .alert.ok { background: var(--bg-success); color: var(--text-success); }
    .alert.ok { border-left-color: #3a995d; }
    .alert.warn { background: var(--bg-warning); color: var(--text-warning); }
    .alert.warn { border-left-color: #d1842b; }
    .alert.danger { background: var(--bg-danger); color: var(--text-danger); }
    .alert.danger { border-left-color: #cc4e43; }

    /* Calendar */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      background: color-mix(in srgb, var(--bg-secondary) 88%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      padding: 10px;
      backdrop-filter: blur(10px) saturate(118%);
      -webkit-backdrop-filter: blur(10px) saturate(118%);
    }
    .day-header {
      text-align: center;
      font-size: 10px;
      color: var(--text-secondary);
      padding: 1px 0 5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.28px;
    }
    .day-cell {
      border-radius: 10px;
      border: 1px solid transparent;
      overflow: hidden;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    .day-cell.empty { pointer-events: none; aspect-ratio: 1; }
    .day-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 2px 4px;
      min-height: 54px;
      cursor: pointer;
    }
    .day-num {
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 1px;
    }
    .day-time-row {
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(98, 130, 120, 0.2);
      padding: 3px 0;
    }
    .day-time-btn {
      width: calc(100% - 8px);
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-tertiary) 88%, transparent);
      color: var(--text-secondary);
      border-radius: 7px;
      padding: 2px 4px;
      font-size: 10px;
      font-family: var(--font-head);
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }
    .day-time-btn:active {
      transform: scale(0.98);
    }
    .day-split {
      border-top: 1px solid rgba(98, 130, 120, 0.14);
      padding: 2px 0 3px;
      text-align: center;
      font-size: 9px;
      color: var(--text-tertiary);
      line-height: 1.2;
    }
    .day-split strong {
      color: var(--text-secondary);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .day-h-input, .day-m-input {
      width: 22px;
      text-align: center;
      background: none;
      border: none;
      font-size: 10px;
      color: var(--text-secondary);
      padding: 1px 0;
      outline: none;
      font-family: var(--font);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .day-h-input::placeholder, .day-m-input::placeholder { color: var(--text-tertiary); }
    .day-h-input:focus, .day-m-input:focus {
      color: var(--text);
      background: rgba(114, 161, 146, 0.14);
      border-radius: 4px;
    }
    .time-sep { font-size: 10px; color: var(--text-tertiary); line-height: 1; }

    .day-cell.workday {
      background: linear-gradient(180deg, var(--workday-start), var(--workday-end));
      border-color: var(--workday-border);
    }
    .day-cell.workday.done { border-color: var(--border); }
    .day-cell.absent { background: var(--absent-bg); }
    .day-cell.absent .day-num { color: var(--absent-text); text-decoration: line-through; }
    .day-cell.absent .day-time-row,
    .day-cell.absent .day-split { display: none; }
    .day-cell.weekend { background: none; }
    .day-cell.weekend .day-num { color: var(--text-tertiary); }
    .day-cell.weekend .day-inner { cursor: pointer; }
    .day-cell.weekend .day-time-row,
    .day-cell.weekend .day-split { display: none; }
    .day-cell.weekend-worked { background: var(--we-bg); }
    .day-cell.weekend-worked .day-num { color: var(--we-text); }
    .day-cell.weekend-worked.done { border-color: var(--we-hover); }
    .day-cell.today { border-color: var(--border-strong) !important; }
    .day-cell.today .day-num { font-weight: 700; }
    .day-running {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      font-size: 9px;
      color: var(--text-info);
      font-weight: 700;
    }
    .run-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-a);
      box-shadow: 0 0 0 0 rgba(106,74,224,0.55);
      animation: pulse-run 1.2s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse-run {
      0% { box-shadow: 0 0 0 0 rgba(106,74,224,0.55); }
      70% { box-shadow: 0 0 0 7px rgba(106,74,224,0); }
      100% { box-shadow: 0 0 0 0 rgba(106,74,224,0); }
    }

    /* Legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-secondary);
      background: color-mix(in srgb, var(--bg-secondary) 88%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(8px) saturate(112%);
      -webkit-backdrop-filter: blur(8px) saturate(112%);
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-weight: 600; }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

    .tracker-card {
      background: color-mix(in srgb, var(--bg-secondary) 86%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
    }
    .tracker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .tracker-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.35px;
      font-weight: 700;
    }
    .tracker-value {
      font-family: var(--font-head);
      font-size: 21px;
      font-weight: 700;
      margin-top: 2px;
    }
    .tracker-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.3px;
      color: #fff;
      cursor: pointer;
      margin-top: 6px;
      transition: transform 0.18s ease, filter 0.18s ease;
    }
    .tracker-btn:active {
      transform: translateY(1px) scale(0.99);
      filter: brightness(0.95);
    }
    .tracker-btn.start { background: linear-gradient(135deg, #1e9a68 0%, #1c7f57 100%); }
    .tracker-btn.stop { background: linear-gradient(135deg, #d14d40 0%, #b1322f 100%); }
    .tracker-note {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 8px;
      line-height: 1.35;
    }

    .manual-form {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .manual-form label {
      font-size: 11px;
      color: var(--text-secondary);
      display: block;
      margin-bottom: 3px;
    }
    .manual-form input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      font-family: var(--font);
      font-weight: 700;
    }
    .manual-form input:focus {
      outline: 2px solid rgba(34, 128, 110, 0.22);
      border-color: #4c9e8a;
    }
    .manual-form button {
      border: none;
      background: linear-gradient(135deg, var(--accent-a) 0%, var(--accent-b) 100%);
      color: #fff;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.35px;
      cursor: pointer;
      transition: transform 0.18s ease;
    }
    .manual-form button:active {
      transform: scale(0.99);
    }

    .log-list { display: grid; gap: 8px; }
    .log-empty {
      font-size: 12px;
      color: var(--text-secondary);
      padding: 8px 2px;
    }
    .log-item {
      background: color-mix(in srgb, var(--bg-secondary) 86%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(8px) saturate(115%);
      -webkit-backdrop-filter: blur(8px) saturate(115%);
    }
    .log-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .log-date {
      font-size: 12px;
      font-weight: 800;
      font-family: var(--font-head);
      letter-spacing: 0.2px;
    }
    .log-duration { font-size: 12px; color: var(--text-info); font-weight: 600; }
    .log-times { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
    .log-actions { display: flex; gap: 8px; }
    .log-actions button {
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text);
      border-radius: 7px;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .log-actions button.delete {
      border-color: #c62828;
      color: #c62828;
    }

    .time-wheel-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 18, 15, 0.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 30;
      padding: 12px;
    }
    .time-wheel-backdrop.hidden { display: none; }
    .time-wheel {
      width: min(460px, 100%);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
      padding: 12px;
      animation: wheel-in 0.2s ease;
    }
    .time-wheel-title {
      font-family: var(--font-head);
      font-size: 14px;
      margin-bottom: 8px;
    }
    .time-wheel-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      line-height: 1.35;
    }
    .time-wheel-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .time-wheel-select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-tertiary);
      color: var(--text);
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      padding: 8px;
      appearance: none;
      -webkit-appearance: none;
    }
    .time-wheel-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .time-wheel-actions button {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: var(--bg-tertiary);
      color: var(--text);
    }
    .time-wheel-actions .apply {
      border: none;
      background: linear-gradient(135deg, var(--accent-a) 0%, var(--accent-b) 100%);
      color: #fff;
    }
    .time-wheel-actions .reset {
      border-color: var(--text-warning);
      color: var(--text-warning);
    }

    .log-edit-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 18, 15, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 31;
      padding: 14px;
    }
    .log-edit-backdrop.hidden { display: none; }
    .log-edit-modal {
      width: min(440px, 100%);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
      padding: 12px;
    }
    .log-edit-title {
      font-family: var(--font-head);
      font-size: 15px;
      margin-bottom: 10px;
    }
    .log-edit-grid {
      display: grid;
      gap: 8px;
    }
    .log-edit-grid label {
      font-size: 11px;
      color: var(--text-secondary);
      display: block;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.25px;
      font-weight: 700;
    }
    .log-edit-grid input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-tertiary);
      color: var(--text);
      padding: 9px 10px;
      font-size: 13px;
      font-family: var(--font);
      font-weight: 700;
    }
    .log-edit-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .log-edit-actions button {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: var(--bg-tertiary);
      color: var(--text);
    }
    .log-edit-actions .save {
      border: none;
      background: linear-gradient(135deg, var(--accent-a) 0%, var(--accent-b) 100%);
      color: #fff;
    }
    @keyframes wheel-in {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (min-width: 768px) {
      #app {
        padding-top: 22px;
        max-width: 640px;
      }
      .day-inner {
        min-height: 58px;
      }
    }

    @media (max-width: 430px) {
      #app {
        padding: 12px 10px 16px;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 12px;
      }
      .stats-grid {
        gap: 8px;
      }
      .stat-card {
        padding: 9px 10px;
      }
      .stat-value {
        font-size: 21px;
      }
      .cal-grid {
        gap: 4px;
        padding: 8px;
      }
      .day-inner {
        min-height: 48px;
        padding: 4px 1px 3px;
      }
      .day-num {
        font-size: 11px;
      }
      .day-time-btn {
        font-size: 9px;
      }
      .day-split {
        font-size: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
<div id="app">
  <h1>Hours Planner</h1>

  <div class="view-switch">
    <button id="switch-planner" class="active">Planner</button>
    <button id="switch-tracker">Tracker</button>
  </div>

  <div id="planner-view" class="view-panel active">
  <div class="top-bar">
    <div class="month-nav">
      <button id="prev">&#8592;</button>
      <span class="month-label" id="month-label"></span>
      <button id="next">&#8594;</button>
    </div>
    <div class="slider-row">
      <label>Target</label>
      <input type="range" id="hours-slider" min="1" max="300" step="1" value="140" />
      <input class="slider-val" id="hours-val" type="number" min="1" max="300" step="1" value="140" aria-label="Monthly target hours" />
    </div>
  </div>

  <div class="stats-grid" id="stats-grid"></div>
  <div id="alert-bar"></div>
  <div class="cal-grid" id="calendar"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--bg-secondary);border:1px solid var(--border);"></div> Workday</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--absent-bg);"></div> Absent</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--we-bg);"></div> Weekend worked</div>
    <div class="legend-item" style="color:var(--text-tertiary);">Tap day to toggle · type hours below</div>
  </div>
  </div>

  <div id="tracker-view" class="view-panel">
    <div class="tracker-card">
      <div class="tracker-row">
        <div>
          <div class="tracker-label">Current status</div>
          <div class="tracker-value" id="tracker-status">Stopped</div>
        </div>
        <div style="text-align:right;">
          <div class="tracker-label">Today tracked</div>
          <div class="tracker-value" id="tracker-today">0h00</div>
        </div>
      </div>
      <div class="tracker-label" id="tracker-running-since">Not running</div>
      <button id="tracker-toggle" class="tracker-btn start">Start</button>
      <div class="tracker-note">Active session stops automatically at midnight.</div>
    </div>

    <div class="tracker-card">
      <div class="tracker-label" style="margin-bottom:8px;">Add manual log</div>
      <div class="manual-form">
        <div>
          <label for="manual-date">Date</label>
          <input id="manual-date" type="date" />
        </div>
        <div>
          <label for="manual-start">Start (12h)</label>
          <input id="manual-start" type="time" step="60" />
        </div>
        <div>
          <label for="manual-end">Stop (12h)</label>
          <input id="manual-end" type="time" step="60" />
        </div>
        <button id="add-manual-log">Add log</button>
      </div>
    </div>

    <div class="tracker-card">
      <div class="tracker-row" style="margin-bottom:0;">
        <div class="tracker-label">Logs for selected month</div>
        <div class="tracker-label" id="log-count">0 entries</div>
      </div>
    </div>
    <div id="log-list" class="log-list"></div>
  </div>

  <div id="time-wheel-backdrop" class="time-wheel-backdrop hidden" role="dialog" aria-modal="true">
    <div class="time-wheel" onclick="event.stopPropagation()">
      <div class="time-wheel-title">Set day total time</div>
      <div id="wheel-meta" class="time-wheel-meta"></div>
      <div class="time-wheel-row">
        <select id="wheel-hour" class="time-wheel-select"></select>
        <span class="time-sep" style="font-size:18px;">:</span>
        <select id="wheel-minute" class="time-wheel-select"></select>
      </div>
      <div class="time-wheel-actions">
        <button id="wheel-cancel">Cancel</button>
        <button id="wheel-reset" class="reset">Reset manual</button>
        <button id="wheel-apply" class="apply">Apply</button>
      </div>
    </div>
  </div>

  <div id="log-edit-backdrop" class="log-edit-backdrop hidden" role="dialog" aria-modal="true">
    <div class="log-edit-modal" onclick="event.stopPropagation()">
      <div class="log-edit-title">Edit log entry</div>
      <div class="log-edit-grid">
        <div>
          <label for="edit-log-date">Date</label>
          <input id="edit-log-date" type="date" />
        </div>
        <div>
          <label for="edit-log-start">Start</label>
          <input id="edit-log-start" type="time" step="60" />
        </div>
        <div>
          <label for="edit-log-end">Stop</label>
          <input id="edit-log-end" type="time" step="60" />
        </div>
      </div>
      <div class="log-edit-actions">
        <button id="edit-log-cancel">Cancel</button>
        <button id="edit-log-save" class="save">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
  const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  let viewNow = new Date();
  let viewYear = viewNow.getFullYear();
  let viewMonth = viewNow.getMonth();
  let monthTargets = {};
  const DEFAULT_TARGET = 140;
  let dayStates = {};
  let loggedHours = {}; // Manual day adjustments in hours by day key.
  let logs = [];
  let timerState = { active: false, startTs: null, startDayKey: null };
  let activeView = 'planner';
  let ticker = null;
  let wheelDay = null;
  let editingLogId = null;

  function getMonthKey() { return `${viewYear}-${viewMonth}`; }
  function getTargetHours() { return monthTargets[getMonthKey()] !== undefined ? monthTargets[getMonthKey()] : DEFAULT_TARGET; }
  function updateSlider() {
    let t = getTargetHours();
    document.getElementById('hours-slider').value = t;
    document.getElementById('hours-val').value = t;
  }

  function setTargetFromPrompt() {
    let raw = document.getElementById('hours-val').value;
    let val = parseInt(String(raw).trim());
    if (Number.isNaN(val)) val = getTargetHours();
    if (val < 1) val = 1;
    if (val > 300) val = 300;
    monthTargets[getMonthKey()] = val;
    document.getElementById('hours-val').value = val;
    document.getElementById('hours-slider').value = val;
    save();
    render();
  }

  const STORAGE_KEY = 'hours-planner-data';

  function getMonthKeyFromDate(dt) { return `${dt.getFullYear()}-${dt.getMonth()}`; }
  function getDayKeyFromDate(dt) { return `${dt.getFullYear()}-${dt.getMonth()}-${dt.getDate()}`; }
  function parseDayKey(key) {
    let p = key.split('-');
    return { y: parseInt(p[0]), m: parseInt(p[1]), d: parseInt(p[2]) };
  }
  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function atMidnightOf(dt) {
    return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime();
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ monthTargets, dayStates, loggedHours, logs, timerState }));
    } catch(e) {}
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (d) {
        monthTargets = d.monthTargets || {};
        // backward compat: single global targetHours migrated to current month
        if (!d.monthTargets && typeof d.targetHours === 'number') {
          monthTargets[getMonthKey()] = d.targetHours;
        }
        dayStates = d.dayStates || {};
        loggedHours = d.loggedHours || {};
        logs = Array.isArray(d.logs) ? d.logs : [];
        timerState = d.timerState || { active: false, startTs: null, startDayKey: null };
        updateSlider();
      }
    } catch(e) {}
  }

  function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
  function firstDayOfWeek(y, m) { let d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; }
  function isWeekendDate(y, m, d) { let dow = new Date(y, m, d).getDay(); return dow === 0 || dow === 6; }
  function isToday(y, m, d) {
    let n = new Date();
    return y === n.getFullYear() && m === n.getMonth() && d === n.getDate();
  }
  function getKey(d) { return `${viewYear}-${viewMonth}-${d}`; }

  function initState(d) {
    let k = getKey(d);
    if (!dayStates[k]) dayStates[k] = isWeekendDate(viewYear, viewMonth, d) ? 'weekend' : 'workday';
    return dayStates[k];
  }

  function getDayStateForDayKey(dayKey) {
    if (dayStates[dayKey] !== undefined) return dayStates[dayKey];
    let parsed = parseDayKey(dayKey);
    let inferred = isWeekendDate(parsed.y, parsed.m, parsed.d) ? 'weekend' : 'workday';
    dayStates[dayKey] = inferred;
    return inferred;
  }

  function isPresent(s) { return s === 'workday' || s === 'weekend-worked'; }
  function isMaskedDay(dayKey) { return !isPresent(getDayStateForDayKey(dayKey)); }

  function cycleState(d) {
    let k = getKey(d);
    let cur = initState(d);
    let isWE = isWeekendDate(viewYear, viewMonth, d);
    if (isWE) {
      dayStates[k] = cur === 'weekend' ? 'weekend-worked' : 'weekend';
    } else {
      dayStates[k] = cur === 'workday' ? 'absent' : 'workday';
    }
    let todayKey = getDayKeyFromDate(new Date());
    if (k === todayKey && timerState.active && !isPresent(dayStates[k])) {
      stopTimer(true);
    }
    save();
    render();
  }
  window.cycleState = cycleState;

  function getAutoHoursForDayKey(dayKey) {
    if (isMaskedDay(dayKey)) return 0;
    let totalMs = 0;
    for (let entry of logs) {
      if (entry.dayKey === dayKey) totalMs += Math.max(0, (entry.endTs || 0) - (entry.startTs || 0));
    }
    let now = new Date();
    let currentDayKey = getDayKeyFromDate(now);
    if (timerState.active && timerState.startDayKey === dayKey && dayKey === currentDayKey) {
      totalMs += Math.max(0, now.getTime() - timerState.startTs);
    }
    return totalMs / 3600000;
  }

  function getTotalHoursForDayKey(dayKey) {
    if (isMaskedDay(dayKey)) return 0;
    let auto = getAutoHoursForDayKey(dayKey);
    let manual = loggedHours[dayKey] || 0;
    return Math.max(0, auto + manual);
  }

  function getManualHoursForDayKey(dayKey) {
    return loggedHours[dayKey] || 0;
  }

  function getTrackedHoursForDayKey(dayKey) {
    return getAutoHoursForDayKey(dayKey);
  }

  function setLoggedHM(d) {
    let k = getKey(d);
    let hEl = document.getElementById('dh-' + d);
    let mEl = document.getElementById('dm-' + d);
    let h = Math.max(0, parseInt(hEl ? hEl.value : '0') || 0);
    let m = Math.max(0, parseInt(mEl ? mEl.value : '0') || 0);
    if (m > 59) m = 59;
    let desiredTotal = h + m / 60;
    let auto = getAutoHoursForDayKey(k);
    let manual = desiredTotal - auto;
    if (Math.abs(manual) < 0.001) delete loggedHours[k];
    else loggedHours[k] = manual;
    save();
    render();
  }
  window.setLoggedHM = setLoggedHM;

  function setLoggedDirect(d, h, m) {
    let k = getKey(d);
    let hh = Math.max(0, parseInt(h) || 0);
    let mm = Math.max(0, parseInt(m) || 0);
    if (hh > 24) hh = 24;
    if (mm > 59) mm = 59;
    let desiredTotal = hh + mm / 60;
    let auto = getAutoHoursForDayKey(k);
    let manual = desiredTotal - auto;
    if (Math.abs(manual) < 0.001) delete loggedHours[k];
    else loggedHours[k] = manual;
    save();
    render();
  }

  function initWheelOptions() {
    let hSel = document.getElementById('wheel-hour');
    let mSel = document.getElementById('wheel-minute');
    if (hSel.options.length === 0) {
      for (let i = 0; i <= 24; i++) {
        let opt = document.createElement('option');
        opt.value = String(i);
        opt.textContent = String(i).padStart(2, '0');
        hSel.appendChild(opt);
      }
    }
    if (mSel.options.length === 0) {
      for (let i = 0; i <= 59; i++) {
        let opt = document.createElement('option');
        opt.value = String(i);
        opt.textContent = String(i).padStart(2, '0');
        mSel.appendChild(opt);
      }
    }
  }

  function openDayWheel(day) {
    initWheelOptions();
    wheelDay = day;
    let hSel = document.getElementById('wheel-hour');
    let mSel = document.getElementById('wheel-minute');
    let k = getKey(day);
    let auto = getAutoHoursForDayKey(k);
    let manual = getManualHoursForDayKey(k);
    let total = Math.max(0, getTotalHoursForDayKey(k));
    let h = Math.floor(total);
    let m = Math.round((total - h) * 60);
    if (m === 60) { h++; m = 0; }
    if (h > 24) h = 24;
    if (m > 59) m = 59;
    hSel.value = String(h);
    mSel.value = String(m);
    document.getElementById('wheel-meta').innerHTML = `Tracked: <strong>${fmt(auto)}</strong> · Manual: <strong>${fmtSigned(manual)}</strong> · Total: <strong>${fmt(total)}</strong>`;
    document.getElementById('time-wheel-backdrop').classList.remove('hidden');
  }

  function closeDayWheel() {
    wheelDay = null;
    document.getElementById('time-wheel-backdrop').classList.add('hidden');
  }

  function applyDayWheel() {
    if (wheelDay === null) return;
    let h = parseInt(document.getElementById('wheel-hour').value) || 0;
    let m = parseInt(document.getElementById('wheel-minute').value) || 0;
    setLoggedDirect(wheelDay, h, m);
    closeDayWheel();
  }

  function resetManualForWheelDay() {
    if (wheelDay === null) return;
    let k = getKey(wheelDay);
    delete loggedHours[k];
    save();
    closeDayWheel();
    render();
  }

  function formatTime12(dt) {
    return dt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
  }

  function formatDate(dt) {
    return dt.toLocaleDateString([], { year: 'numeric', month: 'short', day: '2-digit' });
  }

  function fmt(h) {
    let safe = Math.max(0, h || 0);
    let hh = Math.floor(safe), mm = Math.round((safe - hh) * 60);
    if (mm === 60) { hh++; mm = 0; }
    return `${hh}h${mm.toString().padStart(2,'0')}`;
  }

  function fmtSigned(h) {
    let sign = h < 0 ? '-' : '+';
    return sign + fmt(Math.abs(h));
  }

  function ensureTodayIsPresent() {
    let now = new Date();
    let todayKey = getDayKeyFromDate(now);
    if (!dayStates[todayKey]) dayStates[todayKey] = isWeekendDate(now.getFullYear(), now.getMonth(), now.getDate()) ? 'weekend' : 'workday';
    if (!isPresent(dayStates[todayKey])) {
      alert('Today is marked absent/off. Set today as present before starting the timer.');
      return false;
    }
    return true;
  }

  function startTimer() {
    if (timerState.active) return;
    if (!ensureTodayIsPresent()) return;
    let now = new Date();
    timerState.active = true;
    timerState.startTs = now.getTime();
    timerState.startDayKey = getDayKeyFromDate(now);
    save();
    render();
  }

  function finalizeTimer(endTs) {
    if (!timerState.active || !timerState.startTs) return;
    if (endTs <= timerState.startTs) {
      timerState = { active: false, startTs: null, startDayKey: null };
      save();
      return;
    }
    let start = new Date(timerState.startTs);
    let entry = {
      id: `${timerState.startTs}-${Math.random().toString(36).slice(2, 8)}`,
      startTs: timerState.startTs,
      endTs,
      dayKey: timerState.startDayKey,
      monthKey: getMonthKeyFromDate(start)
    };
    logs.push(entry);
    timerState = { active: false, startTs: null, startDayKey: null };
    save();
  }

  function stopTimer(silent) {
    if (!timerState.active) return;
    finalizeTimer(Date.now());
    if (!silent) render();
  }

  function autoStopAtMidnightIfNeeded() {
    if (!timerState.active || !timerState.startTs) return;
    let start = new Date(timerState.startTs);
    let now = new Date();
    if (!sameDay(start, now)) {
      finalizeTimer(atMidnightOf(now));
      render();
    }
  }

  function recoverTimerAfterLoad() {
    if (!timerState.active || !timerState.startTs) return;
    let start = new Date(timerState.startTs);
    let now = new Date();
    if (!sameDay(start, now)) {
      finalizeTimer(atMidnightOf(now));
    }
  }

  function removeLogsForDay(dayKey) {
    logs = logs.filter(l => l.dayKey !== dayKey);
    save();
    render();
  }

  function deleteLog(id) {
    let idx = logs.findIndex(l => l.id === id);
    if (idx === -1) return;
    if (!confirm('Delete this log entry? This will remove its time from the day total.')) return;
    logs.splice(idx, 1);
    save();
    render();
  }
  window.deleteLog = deleteLog;

  function parseDateAndTime(dateStr, timeStr) {
    if (!dateStr || !timeStr) return null;
    let parts = dateStr.split('-').map(v => parseInt(v));
    let t = timeStr.split(':').map(v => parseInt(v));
    if (parts.length !== 3 || t.length < 2) return null;
    return new Date(parts[0], parts[1] - 1, parts[2], t[0], t[1], 0, 0);
  }

  function addManualLog() {
    let dateVal = document.getElementById('manual-date').value;
    let startVal = document.getElementById('manual-start').value;
    let endVal = document.getElementById('manual-end').value;
    let s = parseDateAndTime(dateVal, startVal);
    let e = parseDateAndTime(dateVal, endVal);
    if (!s || !e) {
      alert('Enter a valid date, start time, and stop time.');
      return;
    }
    if (e <= s) {
      alert('Stop time must be later than start time.');
      return;
    }
    let dayKey = getDayKeyFromDate(s);
    let state = dayStates[dayKey];
    if (!state) {
      dayStates[dayKey] = isWeekendDate(s.getFullYear(), s.getMonth(), s.getDate()) ? 'weekend-worked' : 'workday';
    } else if (!isPresent(state)) {
      dayStates[dayKey] = isWeekendDate(s.getFullYear(), s.getMonth(), s.getDate()) ? 'weekend-worked' : 'workday';
    }
    logs.push({
      id: `${s.getTime()}-${Math.random().toString(36).slice(2,8)}`,
      startTs: s.getTime(),
      endTs: e.getTime(),
      dayKey,
      monthKey: getMonthKeyFromDate(s)
    });
    save();
    render();
  }

  function openEditLogModal(id) {
    let entry = logs.find(l => l.id === id);
    if (!entry) return;
    let sOld = new Date(entry.startTs);
    let eOld = new Date(entry.endTs);
    editingLogId = id;
    document.getElementById('edit-log-date').value = `${sOld.getFullYear()}-${String(sOld.getMonth()+1).padStart(2,'0')}-${String(sOld.getDate()).padStart(2,'0')}`;
    document.getElementById('edit-log-start').value = `${String(sOld.getHours()).padStart(2,'0')}:${String(sOld.getMinutes()).padStart(2,'0')}`;
    document.getElementById('edit-log-end').value = `${String(eOld.getHours()).padStart(2,'0')}:${String(eOld.getMinutes()).padStart(2,'0')}`;
    document.getElementById('log-edit-backdrop').classList.remove('hidden');
  }

  function closeEditLogModal() {
    editingLogId = null;
    document.getElementById('log-edit-backdrop').classList.add('hidden');
  }

  function saveEditLogModal() {
    if (!editingLogId) return;
    let entry = logs.find(l => l.id === editingLogId);
    if (!entry) {
      closeEditLogModal();
      return;
    }
    let dateVal = document.getElementById('edit-log-date').value;
    let startVal = document.getElementById('edit-log-start').value;
    let endVal = document.getElementById('edit-log-end').value;
    let s = parseDateAndTime(dateVal, startVal);
    let e = parseDateAndTime(dateVal, endVal);
    if (!s || !e || e <= s) {
      alert('Invalid date/time values.');
      return;
    }
    entry.startTs = s.getTime();
    entry.endTs = e.getTime();
    entry.dayKey = getDayKeyFromDate(s);
    entry.monthKey = getMonthKeyFromDate(s);
    closeEditLogModal();
    save();
    render();
  }
  function editLog(id) { openEditLogModal(id); }
  window.openEditLogModal = openEditLogModal;
  window.editLog = editLog;

  function getMonthLogs() {
    let mk = getMonthKey();
    return logs
      .filter(l => l.monthKey === mk)
      .sort((a, b) => b.startTs - a.startTs);
  }

  function calcStats() {
    let total = daysInMonth(viewYear, viewMonth);
    let presenceDays = [], absentCount = 0, weekendWorked = 0;
    for (let d = 1; d <= total; d++) {
      let s = initState(d);
      if (s === 'absent') absentCount++;
      else if (s === 'weekend-worked') weekendWorked++;
      if (isPresent(s)) presenceDays.push(d);
    }
    let totalLogged = 0, remainingDays = [];
    for (let d of presenceDays) {
      let k = getKey(d);
      let dayTotal = getTotalHoursForDayKey(k);
      if (dayTotal > 0) totalLogged += dayTotal;
      else remainingDays.push(d);
    }
    let remaining = Math.max(0, getTargetHours() - totalLogged);
    let hPerRemaining = remainingDays.length > 0 ? remaining / remainingDays.length : 0;
    return { presence: presenceDays.length, absent: absentCount, weekendWorked, totalLogged, remaining, remainingDays: remainingDays.length, hPerRemaining };
  }

  function renderStats() {
    let { presence, absent, weekendWorked, totalLogged, remaining, remainingDays, hPerRemaining } = calcStats();
    document.getElementById('stats-grid').innerHTML = `
      <div class="stat-card">
        <div class="stat-label">Days of presence</div>
        <div class="stat-value">${presence}</div>
        <div class="stat-sub">${absent} absent · ${weekendWorked} weekend</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Hours logged</div>
        <div class="stat-value">${totalLogged % 1 === 0 ? totalLogged : totalLogged.toFixed(1)}</div>
        <div class="stat-sub">of ${getTargetHours()} h target</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Hours remaining</div>
        <div class="stat-value">${remaining % 1 === 0 ? remaining : remaining.toFixed(1)}</div>
        <div class="stat-sub">over ${remainingDays} days left</div>
      </div>
      <div class="stat-card highlight">
        <div class="stat-label">Needed per day</div>
        <div class="stat-value">${remainingDays > 0 ? fmt(hPerRemaining) : '—'}</div>
        <div class="stat-sub">${remainingDays > 0 ? hPerRemaining.toFixed(2) + ' h/day' : 'all days logged'}</div>
      </div>
    `;

    let bar = document.getElementById('alert-bar');
    if (presence === 0) {
      bar.innerHTML = `<div class="alert danger">No days of presence — adjust your selections.</div>`;
    } else if (remainingDays === 0 && remaining > 0) {
      bar.innerHTML = `<div class="alert danger">All days logged but ${remaining.toFixed(1)} h still missing.</div>`;
    } else if (remainingDays === 0) {
      let diff = totalLogged - getTargetHours();
      bar.innerHTML = `<div class="alert ok">All days logged. ${diff >= 0 ? '+' + diff.toFixed(1) : diff.toFixed(1)} h vs target.</div>`;
    } else {
      bar.innerHTML = `<div class="alert ok"><strong>${fmt(hPerRemaining)}/day</strong> over ${remainingDays} days · ${totalLogged.toFixed(1)} h done · ${remaining.toFixed(1)} h to go.</div>`;
    }
  }

  function renderCalendar() {
    let cal = document.getElementById('calendar');
    cal.innerHTML = DAY_NAMES.map(d => `<div class="day-header">${d}</div>`).join('');
    let offset = firstDayOfWeek(viewYear, viewMonth);
    let now = new Date();
    let todayKey = getDayKeyFromDate(now);
    for (let i = 0; i < offset; i++) cal.insertAdjacentHTML('beforeend', '<div class="day-cell empty"></div>');
    let total = daysInMonth(viewYear, viewMonth);
    for (let d = 1; d <= total; d++) {
      let s = initState(d);
      let k = getKey(d);
      let today = isToday(viewYear, viewMonth, d) ? ' today' : '';
      let showRunning = timerState.active && k === todayKey;
      let logged = getTotalHoursForDayKey(k);
      let hasDone = logged > 0 ? ' done' : '';
      let present = isPresent(s);
      let hh = '', mm = '';
      if (logged > 0) {
        let totalH = Math.floor(logged);
        let totalM = Math.round((logged - totalH) * 60);
        if (totalM === 60) { totalH++; totalM = 0; }
        hh = totalH; mm = totalM.toString().padStart(2, '0');
      }
      let timeLabel = logged > 0 ? `${String(hh).padStart(2,'0')}:${mm}` : '00:00';
      let inputHTML = present ? `
        <div class="day-time-row" onclick="event.stopPropagation()">
          <button class="day-time-btn" onclick="openDayWheel(${d});event.stopPropagation()">${timeLabel}</button>
        </div>` : '';
      cal.insertAdjacentHTML('beforeend', `
        <div class="day-cell ${s}${hasDone}${today}">
          <div class="day-inner" onclick="cycleState(${d})">
            <span class="day-num">${d}</span>
            ${showRunning ? '<span class="day-running"><span class="run-dot"></span>RUN</span>' : ''}
          </div>
          ${inputHTML}
        </div>
      `);
    }
  }

  function renderTracker() {
    autoStopAtMidnightIfNeeded();
    let todayKey = getDayKeyFromDate(new Date());
    let todayTotal = getTrackedHoursForDayKey(todayKey);
    document.getElementById('tracker-today').textContent = fmt(todayTotal);

    let status = document.getElementById('tracker-status');
    let runningSince = document.getElementById('tracker-running-since');
    let toggle = document.getElementById('tracker-toggle');
    if (timerState.active && timerState.startTs) {
      let sdt = new Date(timerState.startTs);
      status.textContent = 'Running';
      runningSince.textContent = `Running since ${formatTime12(sdt)} · ${formatDate(sdt)}`;
      toggle.textContent = 'Stop';
      toggle.className = 'tracker-btn stop';
    } else {
      status.textContent = 'Stopped';
      runningSince.textContent = 'Not running';
      toggle.textContent = 'Start';
      toggle.className = 'tracker-btn start';
    }

    let monthLogs = getMonthLogs();
    document.getElementById('log-count').textContent = `${monthLogs.length} ${monthLogs.length === 1 ? 'entry' : 'entries'}`;
    let list = document.getElementById('log-list');
    if (!monthLogs.length) {
      list.innerHTML = '<div class="log-empty">No logs for this month.</div>';
      return;
    }
    list.innerHTML = monthLogs.map(l => {
      let s = new Date(l.startTs);
      let e = new Date(l.endTs);
      let dur = Math.max(0, (l.endTs - l.startTs) / 3600000);
      return `
        <div class="log-item">
          <div class="log-head">
            <div class="log-date">${formatDate(s)}</div>
            <div class="log-duration">${fmt(dur)}</div>
          </div>
          <div class="log-times">${formatTime12(s)} - ${formatTime12(e)}</div>
          <div class="log-actions">
            <button onclick="editLog('${l.id}')">Edit</button>
            <button class="delete" onclick="deleteLog('${l.id}')">Delete</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function setView(view) {
    activeView = view;
    let planner = document.getElementById('planner-view');
    let tracker = document.getElementById('tracker-view');
    let switchWrap = document.querySelector('.view-switch');
    let bPlanner = document.getElementById('switch-planner');
    let bTracker = document.getElementById('switch-tracker');
    planner.classList.toggle('active', view === 'planner');
    tracker.classList.toggle('active', view === 'tracker');
    bPlanner.classList.toggle('active', view === 'planner');
    bTracker.classList.toggle('active', view === 'tracker');
    if (switchWrap) switchWrap.classList.toggle('is-tracker', view === 'tracker');
    document.body.classList.toggle('view-tracker', view === 'tracker');
    document.body.classList.toggle('view-planner', view === 'planner');
  }

  function bindBackgroundParallax() {
    const maxShift = 44;
    let ticking = false;
    const update = () => {
      let y = window.scrollY || window.pageYOffset || 0;
      let shift = Math.min(maxShift, y * 0.16);
      document.documentElement.style.setProperty('--scroll-shift', shift.toFixed(2) + 'px');
      ticking = false;
    };
    window.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    }, { passive: true });
    update();
  }

  function bindSwipe() {
    let app = document.getElementById('app');
    let sx = 0, sy = 0, dx = 0, dy = 0;
    app.addEventListener('touchstart', (e) => {
      if (!e.touches[0]) return;
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
      dx = 0;
      dy = 0;
    }, { passive: true });
    app.addEventListener('touchmove', (e) => {
      if (!e.touches[0]) return;
      dx = e.touches[0].clientX - sx;
      dy = e.touches[0].clientY - sy;
    }, { passive: true });
    app.addEventListener('touchend', () => {
      if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;
      if (dx < 0) setView('tracker');
      if (dx > 0) setView('planner');
    });
  }

  function render() {
    document.getElementById('month-label').textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;
    updateSlider();
    renderCalendar();
    renderStats();
    renderTracker();
  }

  document.getElementById('prev').onclick = () => {
    if (viewMonth === 0) { viewMonth = 11; viewYear--; } else viewMonth--;
    render();
  };
  document.getElementById('next').onclick = () => {
    if (viewMonth === 11) { viewMonth = 0; viewYear++; } else viewMonth++;
    render();
  };
  document.getElementById('hours-slider').oninput = function() {
    let val = parseInt(this.value, 10);
    if (Number.isNaN(val)) val = getTargetHours();
    val = Math.min(300, Math.max(1, val));
    monthTargets[getMonthKey()] = val;
    document.getElementById('hours-val').value = val;
    save();
    renderStats();
  };
  document.getElementById('hours-slider').onchange = function() {
    let val = parseInt(this.value, 10);
    if (Number.isNaN(val)) val = getTargetHours();
    val = Math.min(300, Math.max(1, val));
    monthTargets[getMonthKey()] = val;
    document.getElementById('hours-val').value = val;
    save();
    render();
  };
  document.getElementById('hours-val').onchange = setTargetFromPrompt;
  document.getElementById('hours-val').onblur = setTargetFromPrompt;

  document.getElementById('tracker-toggle').onclick = () => {
    if (timerState.active) stopTimer();
    else startTimer();
    render();
  };

  document.getElementById('switch-planner').onclick = () => setView('planner');
  document.getElementById('switch-tracker').onclick = () => setView('tracker');
  document.getElementById('add-manual-log').onclick = addManualLog;
  document.getElementById('time-wheel-backdrop').onclick = closeDayWheel;
  document.getElementById('wheel-cancel').onclick = closeDayWheel;
  document.getElementById('wheel-reset').onclick = resetManualForWheelDay;
  document.getElementById('wheel-apply').onclick = applyDayWheel;
  document.getElementById('log-edit-backdrop').onclick = closeEditLogModal;
  document.getElementById('edit-log-cancel').onclick = closeEditLogModal;
  document.getElementById('edit-log-save').onclick = saveEditLogModal;

  load();
  recoverTimerAfterLoad();
  bindSwipe();
  bindBackgroundParallax();
  let now = new Date();
  document.getElementById('manual-date').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  document.getElementById('manual-start').value = '09:00';
  document.getElementById('manual-end').value = '17:00';
  if (ticker) clearInterval(ticker);
  ticker = setInterval(() => {
    if (timerState.active) render();
  }, 1000);
  render();
</script>
</body>
</html>
